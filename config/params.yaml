# Strategy / model parameters. No magic numbers in code — everything
# thresholds/windows/weights read from here (CLAUDE.md: "هیچ عدد جادویی در کد نباشد").

news:
  # Currency filter (SPEC.md 4.7): USD absolute priority, EUR/GBP half weight, rest dropped.
  currency_weights:
    USD: 1.0
    EUR: 0.5
    GBP: 0.5

  blackout:
    # SPEC.md 4.7-a
    degree_1:  # High impact
      before_min: 20
      after_min: 15
    degree_2:  # Medium impact
      before_min: 15
      after_min: 10
    consensus:
      # If another qualifying event falls within this many minutes of an
      # event's own time, that event's before/after windows are multiplied.
      cluster_window_min: 30
      multiplier: 2

  surprise:
    # Below this many historical samples for the same event, only the raw
    # sign(surprise) x gold_sign direction is reported — no z_surprise.
    min_samples_for_z: 10

  intensity:
    # Minimum historical episodes to report a move range (SPEC.md 4.7-b).
    # Below this, report insufficient data rather than fabricate a range.
    min_episodes: 5
    # band_width: deferred. Full-history fallback until DB has paired z/move rows.
    band_width: 0.5

mt5_bridge:
  # WM Markets demo account, confirmed same depth on live (user, 2026-09-15).
  symbol: "XAUUSD@"
  timeframes: ["M1", "M5", "M15", "H1"]
  backfill_years: 3

  # Broker server time -> UTC. NOT a guess: derived by scanning every
  # weekend gap in the full 2019-2026 H1 history (see docs/data_depth.md
  # investigation, 2026-09-15) for the 1-hour anomaly that marks a DST
  # transition. Found zero exceptions across 7 years:
  #   - DST starts the Friday before the US 2nd-Sunday-of-March date
  #   - DST ends the Friday before the EU last-Sunday-of-October date
  #   (an unusual hybrid, not plain EET or plain "NY+offset" — but the
  #   dates matched exactly, every year, so implemented as measured
  #   rather than assumed to fit a named timezone.)
  # Live cross-check against NTP-synced UTC on 2026-09-15 (DST-active
  # period): broker time was exactly UTC+3. Transition happens over the
  # closed-market weekend, so no candle ever falls in an ambiguous hour.
  server_timezone:
    dst_offset_hours: 3
    standard_offset_hours: 2
    dst_start_rule: "2nd_sunday_march"
    dst_end_rule: "last_sunday_october"

# docs/instrument_rollover.md — correlation module (SPEC.md 4.8) prerequisite.
# Logical instrument -> broker contract-family pattern. compute_levels() etc.
# never see the physical contract name; candles are stored under the LOGICAL
# symbol below, and instrument_contracts (DB) tracks which physical contract
# is currently mapped to it.
#
# Front-month detection (decided 2026-09-17, live-verified against all three
# in docs/instrument_rollover.md): among symbols matching `pattern`, drop any
# with trade_mode == 0 (DISABLED), then pick the highest summed tick_volume
# over the last `volume_window_days` D1 bars among the survivors.
instrument_rollover:
  volume_window_days: 3
  instruments:
    DXY@:
      pattern: "USINDX.*"
      description: "US Dollar Index (broker CFD-futures family)"
    T10Y@:
      pattern: "10TBILL.*"
      description: "US 10 Year T-Note (broker CFD-futures family)"
    BRENT@:
      pattern: "UKBRENT.*"
      description: "UK Brent Crude Oil (broker CFD-futures family) — BRENTCASH/WTICASH evaluated and rejected, see docs/instrument_rollover.md 2.2"

levels:
  # SPEC.md 4.2. Only M5 has explicit parameters in SPEC.md (N=5, k=1.0),
  # and D2 names M5 the base analysis timeframe — so only M5 is run here.
  # H1/M1 were considered (tf_origin column allows multi-tf) but SPEC.md
  # gives no concrete N/k for them; adding those would be guessing, so
  # deferred until the spec (or the user) gives real numbers for them.
  timeframes: ["M5"]

  swing_n: 5          # structural confirmation: N candles before AND after
  swing_k: 1.0         # retracement must be >= k * ATR(14) to confirm a swing
  atr_period: 14

  zone_width_atr_mult: 0.25   # total zone width = this * ATR at birth
  break_atr_mult: 0.5         # candle must CLOSE this many ATRs beyond the zone to count as a valid break
  merge_atr_mult: 1.0         # zones (same kind) closer than this * ATR are merged into one
  max_zone_width_atr_mult: 2.0  # cap merged zone width -- prevents a zone chasing price in a trend (2026-09-24 live bug)

  strength_lambda: 0.0015     # M5 decay rate; half-life ~460 bars (~40 trading hours)

  # NOT in SPEC.md — SPEC only says "strength below a threshold -> expired"
  # without giving the number (unlike the 8x ATR distance rule, which IS
  # explicit). Proposed here, tied directly to the decay formula's own
  # half-life so the reasoning is checkable: a single-touch level with zero
  # reinforcement crosses this after ~5 half-lives (2^-5 = 0.03125) —
  # roughly 2300 M5 bars, ~8 trading days of complete silence. Flag this
  # explicitly as a proposal, not a spec value, until confirmed/adjusted.
  strength_expiry_threshold: 0.03

  expiry_distance_atr_mult: 8   # SPEC.md explicit: distance from current price

  # BUG-FIX 2026-09-16: a zone broken more than this many times has been
  # price-tested from both sides repeatedly and is no longer a reliable
  # directional signal. Expire it immediately on the Nth flip rather than
  # letting it accumulate 30+ flips and fire wrong-direction signals.
  # Root cause of the SELL-on-4280-4298 incident (24 wrong signals, zones
  # had 19-38 flips). Set to 10: catches pathological cases (>10 flips)
  # while allowing normally-contested zones (2-5 flips) to remain active.
  max_break_count: 5

  # Level retention rules: how long to keep a level alive regardless of
  # strength/distance. "Extreme" = price never returned (touch_count==0),
  # meaning the zone is a true untested boundary. "Normal" = has been touched
  # at least once (can decay naturally via strength, but capped by age too).
  extreme_max_days: 365
  normal_max_days: 30
  strength_ref_for_expiry: 2.0  # break_count>=1 expiry: min(30, 30 * strength / str_ref) days

patterns:
  # SPEC.md 4.3. All 61 CDL* functions are run; body_atr filter is applied
  # in the signal ENGINE, not here (store all for analysis).
  atr_period: 14
  # Distance from candle mid to level zone mid, in ATR multiples, for the
  # at_level_id linkage (pattern is "at a level" if within this threshold).
  at_level_distance_atr_mult: 0.5

market_structure:
  # roadmap-rev2 4.4 -- H1 structure (higher-high/higher-low = bullish,
  # lower-high/lower-low = bearish). H1 bars are resampled on the fly from
  # the M5 candle history (see src/engine/market_structure.py docstring --
  # H1 ingestion has been stale since 2026-09-15, tracked separately).
  # Smaller swing_n than the M5 levels detector (5) since H1 has far fewer
  # bars per unit time -- 3 confirmed bars each side is ~3h lookback.
  swing_n: 3
  swing_k: 1.0
  atr_period: 14

module_voting:
  # module_voting_v1 -- interim vote-aggregation framework ahead of the
  # phase-4 fusion layer. min_net_votes is a GUESS, not backtested --
  # explicitly called out for the replay comparison.
  min_net_votes: 2
  weights:
    structure: 1.0
    round_numbers: 1.0
    fibonacci: 1.0
    gaps: 1.0
    patterns: 1.0
    dollar_correlation: 1.0
    # D20 (2026-09-25) -- proposed-rule voters, gated by
    # rules_registry.allow_proposed_in_voting below. Same weight as the
    # existing voters as a neutral starting point; not backtested.
    matrix: 1.0
    rsi_overbought_oversold: 1.0
    rsi_price_divergence: 1.0
    macd_price_divergence: 1.0
    regime_quality: 1.0
    memory_pattern_bias: 1.0
  # DESIGN DECISION (D20): how many M5 bars a confirmed price/RSI or
  # price/MACD divergence event stays "active" for voting purposes before
  # being considered stale. Not specified anywhere -- reusing the rough
  # scale of level_reversion's own spacing filter rather than inventing an
  # unrelated number; sweep candidate for the eventual real backtest.
  divergence_recency_bars: 12
  # SPEC.md 4.15 (D21) — walk-forward purging/embargo parameters.
  # M5 + memory module: embargo >= K+H = 48+12 = 60 candles (5 h),
  # purge >= 5 candles to clear boundary contamination.
  # All values are sweep candidates; change here, not in code.
  walk_forward:
    train_candles: 10080    # 35 days of M5 bars
    test_candles:  2016     # 7 days of M5 bars
    embargo_candles: 60     # >= K+H for memory module
    purge_candles: 5        # boundary contamination buffer

rules_registry:
  # D20 (2026-09-25, session decision -- explicit user approval in chat,
  # no live-trading risk while the system doesn't place real orders yet):
  # when true, rules with status='proposed' in the `rules` table ARE
  # allowed to cast a weighted vote in module_voting_v1, same as
  # verified/testing rules -- but every signal whose components include a
  # still-proposed rule's vote records that rule's id in
  # components.proposed_observations, so the distinction is never lost
  # downstream. Setting this back to false immediately reverts to
  # CLAUDE.md's default (no proposed rule reaches the signal engine) --
  # no code change needed, just this flag and a restart.
  allow_proposed_in_voting: true

signal_rules:
  level_reversion:
    id: "level_reversion_v1"
    # UPDATED 2026-09-19: proximity_atr_mult replaced by zone-touch + directional
    # close (edge-trigger). Signal fires only when the bar's wick enters the zone
    # AND the close is back outside in the reversal direction (not a break-through).
    # proximity_atr_mult: 0.3  # DEPRECATED — no longer used in check_level_reversion
    # Minimum distance from zone edge for the confirmation close, in ATR multiples.
    # Reuses levels.break_atr_mult (same value, 0.5) so no new magic number is
    # introduced. Can be tuned independently here if needed later.
    confirm_atr_mult: 0.5
    min_same_direction_spacing_usd: 10.0

  # PROPOSED (status=proposed, no code yet) — see SPEC.md 4.2-ب
  double_touch_confidence_multiplier:
    status: proposed
    lookback_bars: 50          # bars to scan back for prior touch+confirm events
    min_touches: 2             # minimum qualifying touches in window
    multiplier: 1.3            # base confidence multiplier (sweep range: 1.1–1.5)

round_numbers:
  # SPEC.md 4.4. Psychological price levels and their dual effect.
  # Two behaviors: REVERSAL (profit-taking walls) and ACCELERATION (stop cascade).
  atr_period: 14
  volume_median_bars: 20     # bars for tick_volume median (anti-lookahead: only past bars)

  # Zone width = max(zone_min_width, zone_atr_mult * ATR).
  # Dynamic scaling prevents over-wide zones in quiet markets and under-wide in volatile.
  zone_atr_mult: 0.3
  zone_min_width: 1.0        # dollars; lower bound so zone never vanishes at low ATR

  # ACCELERATION criterion: close > this*ATR beyond the round number (not beyond zone edge)
  break_atr_mult: 0.3

  # Weight hierarchy (highest applicable multiplier wins per level).
  # SPEC.md 4.4: 100→1.0, 50→0.8, 25→0.6, 10→0.4, 5→0.3
  multiples:
    100: 1.0
    50:  0.8
    25:  0.6
    10:  0.4
    5:   0.3

gaps:
  min_size_dollars: 3.0       # gaps smaller than this are ignored
  initial_weight: 0.78        # Osler study: 78.6% of FX gaps fill → weight 0.78
  decay_rate_per_hour: 0.05   # DESIGN DECISION: SPEC does not specify; ~14h half-life
  half_fill_fraction: 0.5     # 50% fill triggers HALF_FILLED state
  fill_mode: body             # body=close crosses gap edge; wick=high/low touches

fibonacci:
  # SPEC.md 4.6. Retracement and extension levels from active S/R swings.
  atr_period: 14
  # DESIGN DECISION: SPEC says "swings from levels" but not which pairs.
  # Using all (support, resistance) pairs within this many ATRs of each other.
  max_pair_distance_atr: 60
  # Limit to closest N pairs by range width near current price.
  max_pairs: 10
  # Overlap threshold: fib price within this*ATR of a level mid -> overlapping=True.
  overlap_atr_mult: 0.25
  retracement_levels: [38.2, 50.0, 61.8]
  extension_levels: [61.8, 100.0, 161.8]

regime:
  # SPEC.md 4.9.
  atr_period: 14
  adx_period: 14
  bb_period: 20
  bb_std: 2.0
  trend_adx_thresh: 25
  range_adx_thresh: 20
  # DESIGN DECISION: rolling percentile window for BB width. 1000 M5 bars ~3.5 days.
  bb_width_pct_window: 1000
  range_bb_pct_thresh: 30

memory:
  # SPEC.md 4.10.
  window_k: 48
  horizon_h: 12
  top_n: 50
  ci_level: 0.95
  n_bootstrap: 1000

correlation:
  # SPEC.md 4.8. Fixed pairs only: 4.8-a/c = XAUUSD@ vs DXY@, 4.8-b = XAUUSD@
  # vs BRENT@. T10Y@ intentionally not used yet (separate open decision).
  atr_period: 14

  # 4.8-a: rolling dollar correlation. SPEC.md explicit.
  dollar_corr_window: 200

  # 4.8-b: oil shock.
  oil_shock_return_bars: 3       # SPEC.md explicit
  oil_shock_atr_mult: 2.5        # SPEC.md explicit
  oil_shock_forward_bars: 6      # SPEC.md explicit
  oil_shock_lag_range: 6         # SPEC.md explicit (lags -6..+6)
  # DESIGN DECISION: SPEC gives the binomial-test METHOD but not a
  # significance threshold. Standard alpha=0.05.
  oil_shock_significance_alpha: 0.05
  # DESIGN DECISION: SPEC gives no minimum-sample rule for this test (unlike
  # gaps' explicit ">30" in SPEC.md 4.5). Reusing that same convention here
  # for the same "is this real, not noise" question.
  oil_shock_min_samples: 30

  # 4.8-c: accumulated pressure + discharge.
  # DESIGN DECISION: SPEC says "رگرسیون بازده طلا روی بازده دلار (پنجره
  # متحرک)" without a window length. Reusing 4.8-a's own explicit
  # 200-candle window for the identical gold/dollar relationship rather
  # than inventing an unrelated number.
  pressure_regression_window: 200
  pressure_sum_window: 48          # SPEC.md explicit
  # DESIGN DECISION: SPEC says pressure is "نرمال‌شده به z" without
  # specifying the lookback for that normalization's own mean/std. Matching
  # regime.py's own bb_width_pct_window precedent (a generous rolling
  # baseline for a percentile/z-type normalization).
  pressure_z_window: 500
  pressure_flag_threshold: 2.0     # SPEC.md explicit
  pressure_flag_min_bars: 12       # SPEC.md explicit
  pressure_discharge_atr_mult: 2.0 # SPEC.md explicit
  # DESIGN DECISION: SPEC does not say how far forward to search before
  # concluding "no discharge happened" for a given flag. Chosen as 2x the
  # pressure_sum_window (a round, documented guess, not hidden).
  pressure_discharge_lookout_bars: 96
  pressure_validation_horizons: [12, 24]  # SPEC.md explicit
  # DESIGN DECISION (added 2026-09-18, see backtest_pressure_reversal()
  # docstring): minimum discharge success rate for 'verified'. SPEC gives
  # no number here either; 0.5 (a coin flip) is the lowest bar at which a
  # "does it usually discharge" claim means anything at all.
  pressure_min_success_rate: 0.5

rsi:
  # Proposed module (not yet in SPEC.md -- see 2026-09-24 task report).
  # rule id: rsi_overbought_oversold.
  period: 14
  overbought: 70
  oversold: 30

macd:
  # Proposed module. rule id: macd_price_divergence.
  fast_period: 12
  slow_period: 26
  signal_period: 9
  # DESIGN DECISION: divergence compared against the MACD LINE, not the
  # histogram. The line (fast EMA - slow EMA) is the series Appel's original
  # MACD divergence definition compares to price; the histogram (line -
  # signal) is a second derivative that crosses zero far more often and is
  # conventionally used for momentum/crossover timing, not price divergence.
  # See final report for the full reasoning.
  divergence_source: "macd_line"  # "macd_line" | "histogram"

divergence:
  # Shared by compute_price_rsi_divergence() and compute_price_macd_divergence()
  # (src/features/rsi.py). Deliberately separate from levels.swing_n/swing_k:
  # those are tuned for support/resistance zone sizing (ATR-retracement
  # filtered); this is a plain N-bar fractal pivot with no ATR filter, the
  # standard definition for oscillator divergence. See final report.
  swing_n: 5            # bars required strictly higher/lower on each side to confirm a pivot
  lookback_bars: 100     # max bar distance between the two compared swings

matrix:
  # SPEC.md 4.10 (D18). Proposed until backtest acceptance criterion
  # (score>=4 correlating >=0.3 with successful signal direction) is met.
  tf_list: ["M1", "M5", "M15", "M30", "H1", "H4", "D1"]
  min_votes: 6          # of 10 indicators, for a timeframe to vote buy/sell
  min_tf_agreement: 4   # of 6 non-M5 timeframes; fusion-layer threshold, not enforced here

  # DESIGN DECISION: SPEC.md 4.10 names the 10 indicators and their role
  # but not their periods -- standard TA-Lib textbook defaults used
  # throughout, documented in src/features/matrix.py's module docstring
  # alongside each indicator's vote convention.
  indicator_periods:
    rsi_period: 14
    stoch_fastk: 14
    stoch_slowk: 3
    stoch_slowd: 3
    cci_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    ma_period: 20
    adx_period: 14
    willr_period: 14
    momentum_period: 10
    bbp_ema_period: 13   # Elder's Bulls/Bears Power original recommendation
    volume_period: 20
