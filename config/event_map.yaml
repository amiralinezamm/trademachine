# Event -> gold direction map (SPEC.md 4.7-b table).
# Rebuilt 2026-09-27 from the user's own researched impact table
# (xauusd_news_impact.json, asOf 2026-09-27) — gold_sign is no longer a
# project guess, it is what the user supplied ('dir': up/down per event).
#
# gold_sign: -1 means "actual above forecast -> gold expected DOWN".
#            +1 means the inverse.
#
# IMPORTANT — this is why `country` exists on every entry and lookup_gold_sign()
# takes a country argument now: the SAME title (e.g. "CPI y/y", "GDP m/m",
# "Retail Sales m/m") means the OPPOSITE gold_sign depending on currency.
# A USD indicator moves gold through the Fed/DXY channel (strong USD data ->
# stronger dollar -> gold down); a EUR/GBP indicator moves gold through the
# inverse-DXY channel (strong EUR/GBP data -> weaker dollar -> gold up). Matching
# by title alone would silently pick whichever entry happened to load last.
#
# tier (1-5), usd_range, pct_range: expected |move| in the first ~15-60min after
# release, from the user's table (meta.tiers below explains the tier bands).
# Not yet consumed by any code — stored for the intensity_estimator/backtest
# work later, so this research doesn't have to be redone.
#
# Matching is exact (title + country), case-insensitive, against `aliases`.
# If a real event's (title, country) doesn't match any alias here, don't guess
# a new mapping — same project rule as before.

